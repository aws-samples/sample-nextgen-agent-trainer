<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solution Architecture — NextGen Agent Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F3F4F6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2563EB;
      border-bottom: 1px solid #1D4ED8;
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgb(37 99 235 / 0.25);
      flex-shrink: 0;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .logo-section i { font-size: 1.1rem; }
    .logo-section h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .page-heading {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #E5E7EB;
    }

    .page-heading h2 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .page-heading h2 i { color: #2563EB; }

    .page-heading p {
      font-size: 0.875rem;
      color: #6B7280;
    }

    .diagram-card {
      width: 100%;
      max-width: 1200px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08);
      padding: 2rem;
    }

    .diagram-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-section">
      <i class="fas fa-headset"></i>
      <h1>NextGen Agent Trainer</h1>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <h2><i class="fas fa-diagram-project"></i> Solution Architecture</h2>
      <p>End-to-end architecture of the NextGen Agent Trainer platform</p>
    </div>

    <div class="diagram-card">
      <img src="./nat-architecture.png" alt="NextGen Agent Trainer architecture diagram" />
    </div>
  </main>
</body>
</html>
